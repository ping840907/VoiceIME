pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // MLC LLM Maven repo (fallback when local AAR is not used)
        maven { url "https://mlc.ai/package" }
        // Local AAR directory — drop mlc4j-*.aar / sherpa-onnx-*.aar into app/libs/
        flatDir { dirs 'app/libs' }
    }
}
rootProject.name = "ElderlyAssistant"
include ':app'
