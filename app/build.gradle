plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ping.elderlyassistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.ping.elderlyassistant"
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName "2.0.0"

        // sherpa-onnx ships arm64-v8a prebuilt .so; other ABIs not needed for POCO F6
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    buildFeatures { viewBinding true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Coroutines: all heavy work (recording, ASR, LLM) runs on Dispatchers.IO
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ── SenseVoice ASR via sherpa-onnx ───────────────────────────────────────
    // Option A — Maven Central (recommended, no manual download)
    //   Check latest version: https://github.com/k2-fsa/sherpa-onnx/releases
    implementation 'com.k2fsa.sherpa.onnx:sherpa-onnx-android:1.13.3'
    //
    // Option B — local AAR (if Maven is blocked or you need a custom build)
    //   Drop sherpa-onnx-android-arm64-v8a-*.aar into app/libs/
    //   implementation(name: 'sherpa-onnx-android-arm64-v8a-1.13.3', ext: 'aar')

    // ── MLC LLM (mlc4j) for Qwen3-1.7B ──────────────────────────────────────
    // Option A — local AAR (download from https://github.com/mlc-ai/mlc-llm/releases)
    //   Drop mlc4j-*.aar into app/libs/ then uncomment:
    //   implementation fileTree(dir: 'libs', include: ['mlc4j*.aar'])
    //
    // Option B — Maven (verify version at https://mlc.ai/package)
    //   implementation 'ai.mlc.mlcllm:mlc4j:0.1.0'
}
