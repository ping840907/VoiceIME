plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ping.voiceim'
    compileSdk 34

    defaultConfig {
        applicationId "com.ping.voiceim"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { viewBinding true; buildConfig true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // Qwen3 ASR via sherpa-onnx AAR (drop sherpa-onnx-<version>.aar into app/libs/)
    implementation(name: 'sherpa-onnx-1.13.3', ext: 'aar')

    // OpenCC — Simplified → Traditional Chinese
    implementation 'com.github.houbb:opencc4j:1.8.1'

    // tar.bz2 extraction for downloaded Qwen3-ASR model archive
    implementation 'org.apache.commons:commons-compress:1.26.0'
}
